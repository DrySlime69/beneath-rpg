<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Beneath - Mining RPG Prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <div id="message"></div>
    <div id="inventory">
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
  </div>

  <div id="inventoryScreen">
    <div id="inventoryPanel">
      <h2>Inventory</h2>
      <div class="inventoryLabel">Hotbar</div>
      <div id="hotbarGrid"></div>
      <div class="inventoryLabel">Backpack</div>
      <div id="backpackGrid"></div>
      <div id="inventoryHint">I = close inventory. T = teleport. P = place Furnace.</div>
    </div>
  </div>

  <script src="src/ui.js"></script>
  <script src="src/inventory.js"></script>
  <script src="src/world.js"></script>
  <script src="src/player.js"></script>
  <script src="src/crafting.js"></script>
  <script src="src/base.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
